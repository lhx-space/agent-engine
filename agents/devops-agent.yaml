# 垂直领域 Agent 示例：DevOps 助手（云原生 / CI-CD / K8s 诊断）
# 覆盖全家桶：rules / skills / documents / memory / web / mcp / files / bash / git / guardrails / otel
name: devops-agent
description: 云原生与 CI/CD 领域的 DevOps 助手
version: 1.0.0

model:
  provider: openai-compatible # 默认 DeepSeek（OpenAI 兼容）；也支持 anthropic / custom
  baseURL: https://api.deepseek.com/v1
  model: deepseek-chat
  temperature: 0.2
  maxTokens: 4096
  topP: 0.9 # 核采样（0~1）
  # toolChoice: auto # auto | none | required | { type: function, function: { name } }
  # parallelToolCalls: true # 是否并行多工具
  # extra: {} # vendor 原生参数透传兜底

# rules 经 plugin-rules（ContextContributor）自动注入，无需 {{rules}} 占位符
systemPrompt:
  template: |
    你是 {{role}}，专注于 {{domain}} 领域。
    排查问题先看现象，再逐步定位，最后给出可执行的操作步骤。
  variables:
    role: DevOps 运维专家
    domain: 云原生与 CI/CD

# 上下文规则：always 强制注入 / on-demand 按查询语义检索注入
rules:
  - id: no-destructive-command
    kind: always
    description: 禁止执行破坏性命令
    content: 禁止执行 rm -rf、DROP TABLE、DROP DATABASE 等破坏性命令；执行前须说明影响范围并征得确认。
    tags: [安全]
  - id: k8s-diagnosis
    kind: on-demand
    description: Kubernetes 故障诊断规范
    content: 排查顺序：kubectl get events → describe pod → logs → 逐层定位。
    tags: [k8s, kubernetes, 诊断]

# 技能（find-skill 机制）：经 server `POST /api/skills/install` 安装后，用 path 指向本地
# 例如安装 vercel-labs/agent-skills 的 deploy-to-vercel → path: ~/.agents/skills/deploy-to-vercel
skills:
  - source: path
    path: ./skills/incident-response

# 外部 MCP server → 归一化为标准工具
mcp:
  servers:
    - name: github
      source: command
      command: npx
      args: ['-y', '@modelcontextprotocol/server-github']
      env:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

# 三层记忆：会话窗口（裁剪 + 摘要）+ 长期记忆（语义召回 + 持久化）
memory:
  session:
    maxMessages: 50
    maxTokens: 8000
    summary: true
  longTerm:
    backend: in-memory # 生产可换 pgvector（经插件注册）

# 向量模型（可选）：配置后 rules / skills / documents / 长期记忆 启用语义召回（BM25 + 向量 RRF）
# DeepSeek 不提供 embeddings；用 OpenAI / 本地 ollama 等
# embedding:
#   provider: openai-compatible
#   baseURL: https://api.openai.com/v1
#   model: text-embedding-3-small

# 文档摄入：归一化 → 分块 → 检索注入 [文档]
documents:
  sources: ['./knowledge'] # 文件或目录（目录递归）
  chunking:
    strategy: heading # heading | fixed
    size: 1000
    overlap: 0
  topK: 4

# 声明式安全拦截（可执行，独立于文本类 rules）
guardrails:
  - id: deny-rm
    on: beforeToolCall
    denyTools: [bash]
    denyPatterns: ['rm -rf']

# 执行预算 / 重试 / 续写
execution:
  maxSteps: 10
  maxToolCalls: 30
  timeoutMs: 120000
  toolRetry:
    maxRetries: 2
    baseDelayMs: 500

# 能力插件（rules/skills/documents/memory/web/mcp/guardrails）由 preset-default 按 config 切片自动激活；
# files/bash/git/otel 仍按需在 plugins 声明（server 层注入工厂）
plugins:
  - '@agent-engine/plugin-files' # read_file / write_file / list_files
  - '@agent-engine/plugin-bash' # bash（需 security.bash.enabled + 沙箱）
  - '@agent-engine/plugin-git' # git 工具套件（只读默认、经沙箱）
  - '@agent-engine/plugin-otel' # OpenTelemetry 可观测（exporter 经 OTel SDK 配置）

# 安全默认：bash 默认禁用；开启后经 docker/nsjail 沙箱执行，绝不回退宿主裸奔
security:
  sandbox:
    backend: auto # docker | nsjail | auto
    image: agent-engine/sandbox
    compact: false # 开启后经 rtk 压缩命令输出省 token（沙箱镜像需含 rtk）
  bash:
    enabled: true # 默认 false；开启后命令经沙箱执行
    allowCommands: [kubectl, git, ls, cat]
    denyPatterns: ['rm -rf', 'DROP TABLE', 'DROP DATABASE']
    allowNetwork: true # kubectl 需连集群，默认 false
    timeoutMs: 30000
    maxOutputBytes: 65536
  files:
    roots: [/workspace]
    maxFileBytes: 1048576
  webSearch:
    provider: duckduckgo # searxng | duckduckgo | tavily | serper
    fallback: duckduckgo
    maxResults: 8
  webFetch:
    allowDomains: []
    denyDomains: []
