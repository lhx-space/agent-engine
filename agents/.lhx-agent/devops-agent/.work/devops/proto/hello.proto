syntax = "proto3";

package hello;

// Greeter 服务：演示一元 + 服务端流两种模式
service Greeter {
  // 一元调用
  rpc SayHello (HelloRequest) returns (HelloReply);
  // 服务端流式（用于流式生成/推送）
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
