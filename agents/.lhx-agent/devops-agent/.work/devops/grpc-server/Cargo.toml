[package]
name = "lhx-agent-engine-grpc-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "grpc-server"
path = "src/main.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.4"
tokio-stream = "0.1.19"

[build-dependencies]
tonic-build = "0.11"
